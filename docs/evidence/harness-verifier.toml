default_permissions = "probe"
[permissions.probe.filesystem]
":root" = "deny"
":slash_tmp" = "deny"
"/private/tmp" = "deny"
":minimal" = "read"
"/private/tmp/rss-harness-iqdmr4nu/source" = "read"
"/private/tmp/rss-harness-iqdmr4nu/output" = "write"
"/private/tmp/rss-harness-iqdmr4nu/control/probe" = "read"
[permissions.probe.network]
enabled = false
