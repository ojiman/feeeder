name: Feeeder CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: ${{ matrix.job }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        job: [regression, release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_RESULTS: ${{ github.workspace }}/ci-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record commit and environment
        run: |
          mkdir -p "$CI_RESULTS"
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
          } | tee "$CI_RESULTS/environment.txt"
      - name: Run tests
        if: matrix.job == 'regression'
        run: |
          { time swift test --scratch-path "$RUNNER_TEMP/feeeder-ci-build" --force-resolved-versions --disable-keychain --disable-netrc; } 2>&1 | tee "$CI_RESULTS/tests.log"
      - name: Build unsigned Release app
        if: matrix.job == 'release'
        run: |
          { time bash scripts/build-app.sh release; } 2>&1 | tee "$CI_RESULTS/build.log"
          ditto -c -k --sequesterRsrc --keepParent .build/Feeeder.app "$CI_RESULTS/Feeeder-unsigned.zip"
      - name: Save logs and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feeeder-${{ matrix.job }}-${{ github.sha }}
          path: ${{ env.CI_RESULTS }}/
          if-no-files-found: warn
          retention-days: 7
