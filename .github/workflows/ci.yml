name: Feeeder CI

on:
  # No paths-ignore here: every pull request must report the `check` status (the ruleset requires it), so a
  # documentation-only change still starts this workflow. The `changes` job then skips the macOS jobs for it.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Only a pull request can be documentation-only. Any other event runs the tests.
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
            code=$(printf '%s\n' "$files" | bash scripts/ci-gate.sh classify)
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  verify:
    name: ${{ matrix.job }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # No macOS 27 runner exists yet: this verifies the build floor (26.6), not the support floor (27.0). See docs/decisions/0007.
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        job: [regression, release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI_RESULTS: ${{ github.workspace }}/ci-results
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record commit and environment
        run: |
          mkdir -p "$CI_RESULTS"
          {
            git rev-parse HEAD
            printf 'pr_head=%s\n' "$PR_HEAD"
            sw_vers
            uname -m
            xcodebuild -version
            swift --version
          } | tee "$CI_RESULTS/environment.txt"
      - name: Run tests
        if: matrix.job == 'regression'
        run: |
          { time swift test --scratch-path "$RUNNER_TEMP/feeeder-ci-build" --force-resolved-versions --disable-keychain --disable-netrc; } 2>&1 | tee "$CI_RESULTS/tests.log"
      - name: Build and verify ad hoc Release app
        if: matrix.job == 'release'
        run: |
          { time bash scripts/build-app.sh release; } 2>&1 | tee "$CI_RESULTS/build.log"
          package_dir=$(mktemp -d "$RUNNER_TEMP/feeeder-adhoc.XXXXXX")
          ditto -c -k --sequesterRsrc --keepParent .build/Feeeder.app "$CI_RESULTS/Feeeder-adhoc.zip"
          ditto -x -k "$CI_RESULTS/Feeeder-adhoc.zip" "$package_dir"
          codesign --verify --deep --strict "$package_dir/Feeeder.app"
      - name: Save logs and artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feeeder-${{ matrix.job }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.CI_RESULTS }}/
          if-no-files-found: warn
          retention-days: 7

  # The one status that the ruleset requires. It always runs, and it fails when the macOS jobs fail, are cancelled,
  # or were skipped for a change that touched code.
  check:
    name: check
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test the gate script
        run: bash scripts/test-ci-gate.sh
      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          VERIFY: ${{ needs.verify.result }}
        run: bash scripts/ci-gate.sh verdict "$CHANGES" "${CODE:-true}" "$VERIFY"
